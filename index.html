<title>Drill Vocabulaire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: une colonne étroite, une carte de question centrée sur l'action, barre de progression fine en haut. */
:root {
  --bg: #f1f4f8;
  --surface: #ffffff;
  --fg: #101c2b;
  --muted: #5a6a7d;
  --line: #d6dde7;
  --accent: #2a55d9;
  --accent-ink: #ffffff;
  --chip: #e5ebf6;
  --good: #167a4e;
  --good-bg: #e0f3ea;
  --bad: #b73a29;
  --bad-bg: #fbe6e1;
  --warn: #8a6100;
  --warn-bg: #fbf0d2;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1520; --surface: #162030; --fg: #e8edf5; --muted: #91a0b4; --line: #293549;
    --accent: #7f9fff; --accent-ink: #0b1220; --chip: #1f2c45;
    --good: #52cb94; --good-bg: #11322a; --bad: #ff8f7d; --bad-bg: #3b1c17;
    --warn: #f0c768; --warn-bg: #3a2f10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1520; --surface: #162030; --fg: #e8edf5; --muted: #91a0b4; --line: #293549;
  --accent: #7f9fff; --accent-ink: #0b1220; --chip: #1f2c45;
  --good: #52cb94; --good-bg: #11322a; --bad: #ff8f7d; --bad-bg: #3b1c17;
  --warn: #f0c768; --warn-bg: #3a2f10; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 16px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.count { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.score { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.grow { flex: 1; }
.link { background: none; border: 0; color: var(--muted); padding: 8px 4px; font-size: .9rem; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--fg); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.tag { align-self: flex-start; background: var(--chip); color: var(--fg); font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
.prompt { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.55rem, 6vw, 2.1rem); line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
.hint { margin: -6px 0 0; color: var(--muted); font-size: .95rem; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; min-height: 54px; padding: 10px 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .n { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; background: var(--chip); font-size: .78rem; font-weight: 600; color: var(--muted); }
.opt:disabled { cursor: default; }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt.dim { opacity: .55; }
.typed { display: flex; gap: 10px; flex-wrap: wrap; }
.typed input { flex: 1 1 200px; min-width: 0; font-size: 18px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.typed input:disabled { opacity: .7; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; min-height: 48px; }
.primary:hover { filter: brightness(1.08); }
.ghost { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 18px; min-height: 48px; }
.ghost:hover { border-color: var(--accent); }
.fb { border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.fb strong { font-family: var(--font-display); font-size: 1.05rem; }
.fb.good { background: var(--good-bg); color: var(--good); }
.fb.bad { background: var(--bad-bg); color: var(--bad); }
.fb.warn { background: var(--warn-bg); color: var(--warn); }
.fb span { color: var(--fg); overflow-wrap: anywhere; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

h2 { margin: 0; font-family: var(--font-display); font-size: 1.5rem; }
h3 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; color: var(--muted); font-size: .92rem; }
.stats b { color: var(--fg); font-variant-numeric: tabular-nums; }
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.list > div { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
.list .q { font-weight: 600; }
.list .a { color: var(--muted); font-size: .92rem; }
.list .a s { color: var(--bad); }
.list .note { color: var(--muted); font-size: .85rem; }
.set { display: flex; flex-direction: column; gap: 8px; }
.set label { display: flex; gap: 10px; align-items: center; min-height: 36px; }
.set input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
.set select { padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); min-height: 44px; }
.fine { color: var(--muted); font-size: .85rem; margin: 0; }
.empty { text-align: center; color: var(--muted); padding: 12px 0; }
@media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>

<div class="wrap" id="app">
  <section id="v-quiz" hidden>
    <div class="top">
      <span class="count" id="cnt"></span>
      <span class="score">Juste : <b id="score">0</b></span>
      <span class="score" id="streak"></span>
      <span class="grow"></span>
      <button class="link" id="b-set">Réglages</button>
      <button class="link" id="b-stop">Terminer</button>
    </div>
    <div class="bar" style="margin-block:10px 14px"><div id="fill"></div></div>
    <div class="card" id="card"></div>
  </section>

  <section id="v-end" hidden class="card"></section>

  <section id="v-set" hidden class="card">
    <h2>Réglages</h2>
    <div class="set">
      <h3>Types de questions</h3>
      <label><input type="checkbox" id="t-en2fr"> Anglais vers français (QCM)</label>
      <label><input type="checkbox" id="t-fr2en"> Français vers anglais (QCM)</label>
      <label><input type="checkbox" id="t-typed"> Écrire la réponse au clavier</label>
      <label><input type="checkbox" id="t-spell"> Choisir la bonne orthographe</label>
      <label><input type="checkbox" id="t-abbr"> Abréviations réseau (LAN, OSPF, RFC…)</label>
      <label><input type="checkbox" id="t-irr"> Verbes irréguliers</label>
    </div>
    <div class="set">
      <h3>Longueur de la série</h3>
      <select id="s-n">
        <option value="60">60 questions</option>
        <option value="120">120 questions</option>
        <option value="200">200 questions</option>
        <option value="300">300 questions</option>
        <option value="450">450 questions (marathon)</option>
      </select>
      <h3 style="margin-top:8px">Mots à travailler</h3>
      <select id="s-focus">
        <option value="all">Tous les mots</option>
        <option value="weak">Surtout mes mots ratés</option>
      </select>
      <label style="margin-top:6px"><input type="checkbox" id="s-auto"> Passer tout seul à la suite quand c'est juste</label>
    </div>
    <div class="row">
      <button class="primary" id="b-go">Lancer une nouvelle série</button>
      <button class="ghost" id="b-cancel">Retour</button>
    </div>
    <div class="row">
      <button class="ghost" id="b-corr">Corrections faites à mes cartes</button>
      <button class="ghost" id="b-reset">Effacer mes stats</button>
    </div>
    <p class="fine" id="fine"></p>
  </section>

  <section id="v-corr" hidden class="card">
    <h2>Corrections faites à mes cartes</h2>
    <p class="fine">Ces cartes avaient une faute ou une traduction approximative. Compare avec ton cours : si ton prof attend une autre version, garde la sienne.</p>
    <div class="list" id="corr-list"></div>
    <div class="row"><button class="primary" id="b-corr-back">Retour</button></div>
  </section>
</div>

    c.enShape = c.k === 'a' ? 'abbr' : /^to /.test(c.f) ? 'verb' : /\s/.test(c.f) ? 'phrase' : 'word';
    c.frShape = frShape(c.b);
    ALLF[norm(c.f)] = 1;
  });

  /* ---------- pondération selon mes erreurs ---------- */
  function weight(c) {
    var st = stats[c.f]; if (!st) return 1;
    return Math.min(6, Math.max(0.5, 1 + 1.5 * st.m - 0.6 * st.s));
  }
  function isWeak(c) { var st = stats[c.f]; return !!(st && st.m > 0 && weight(c) > 1.2); }
  function pickCards(pool, k) {
    var out = [];
    if (!pool.length) return out;
    while (out.length < k) {
      var keyed = pool.map(function (c) { return [Math.pow(Math.random(), 1 / weight(c)), c]; })
        .sort(function (a, b) { return b[0] - a[0]; }).map(function (x) { return x[1]; });
      out = out.concat(keyed.slice(0, k - out.length));
    }
    return out;
  }

  /* ---------- distracteurs difficiles ---------- */
  function distractors(card, side, n) {
    var isA = card.k === 'a';
    var cand = CARDS.filter(function (o) {
      return o.i !== card.i && (o.k === 'a') === isA && o.bk !== card.bk &&
        !o.m.some(function (x) { return card.m.indexOf(x) >= 0; });
    });
    var ta = card[side];
    var sc = cand.map(function (o) {
      var tb = o[side], s = Math.random() * 1.3;
      var same = side === 'f' ? o.enShape === card.enShape : o.frShape === card.frShape;
      if (same) s += 2.2;
      if (o.g === card.g) s += 0.7;
      s += sim(ta, tb) * 2.4;
      s += 1 - Math.min(1, Math.abs(ta.length - tb.length) / Math.max(ta.length, tb.length));
      return [s, o];
    }).sort(function (a, b) { return b[0] - a[0]; });
    var out = [], seen = {}; seen[norm(ta)] = 1;
    for (var i = 0; i < sc.length && out.length < n; i++) {
      var k = norm(sc[i][1][side]); if (seen[k]) continue; seen[k] = 1; out.push(sc[i][1]);
    }
    return out;
  }

  /* ---------- constructeurs de questions ---------- */
  function mcq(c, dir) {
    var promptSide = (dir === 'en2fr' || dir === 'abbr2full') ? 'f' : 'b';
    var optSide = promptSide === 'f' ? 'b' : 'f';
    var tags = { en2fr: 'Anglais → Français', fr2en: 'Français → Anglais', abbr2full: 'Abréviation', full2abbr: 'Abréviation' };
    var hints = { en2fr: '', fr2en: '', abbr2full: 'Que signifie cette abréviation ?', full2abbr: 'Quelle est l\'abréviation correspondante ?' };
    var opts = distractors(c, optSide, 3).map(function (o) { return { t: o[optSide], ok: false }; });
    opts.push({ t: c[optSide], ok: true });
    return { kind: 'mcq', tag: tags[dir], prompt: c[promptSide], hint: hints[dir], opts: shuffle(opts), explain: c.f + '  =  ' + c.b, card: c };
  }
  function variants(c) {
    var v = {};
    function add(s) { s = norm(s); if (!s) return; v[s] = 1; if (s.indexOf('to ') === 0) v[s.slice(3)] = 1; }
    add(c.f); add(c.f.replace(/\([^)]*\)/g, ''));
    c.f.split(/\s*\/\s*/).forEach(add);
    (c.acc || []).forEach(add);
    return Object.keys(v);
  }
  function typedWord(c) {
    var acc = {};
    CARDS.filter(function (o) { return o.k !== 'a' && (o.i === c.i || o.m.some(function (x) { return c.m.indexOf(x) >= 0; })); })
      .forEach(function (o) { variants(o).forEach(function (x) { acc[x] = 1; }); });
    return { kind: 'typed', tag: 'Écris-le en anglais', prompt: c.b, hint: /^to /.test(c.f) ? 'Verbe : avec ou sans « to ».' : 'Tape le mot ou l\'expression en anglais.', accepted: Object.keys(acc), tol: 0, show: c.f, explain: c.f + '  =  ' + c.b, card: c };
  }
  function typedFull(c) {
    var acc = [norm(c.b)].concat((c.acc || []).map(norm));
    var L = norm(c.b).length;
    return { kind: 'typed', tag: 'Abréviation, forme complète', prompt: c.f, hint: 'Écris ce que signifie cette abréviation, en anglais.', accepted: acc, tol: L >= 20 ? 2 : L >= 9 ? 1 : 0, show: c.b, explain: c.f + '  =  ' + c.b, card: c };
  }
  function mutate(w) {
    var res = {}, vow = 'aeiouy', i;
    for (i = 1; i < w.length - 1; i++) if (vow.indexOf(w[i]) < 0 && w[i] !== w[i - 1] && w[i] !== w[i + 1]) res[w.slice(0, i + 1) + w[i] + w.slice(i + 1)] = 1;
    for (i = 1; i < w.length; i++) if (w[i] === w[i - 1]) res[w.slice(0, i) + w.slice(i + 1)] = 1;
    for (i = 1; i < w.length - 2; i++) if (w[i] !== w[i + 1]) res[w.slice(0, i) + w[i + 1] + w[i] + w.slice(i + 2)] = 1;
    var vm = { a: 'e', e: 'a', i: 'y', y: 'i', o: 'u', u: 'o' };
    for (i = 1; i < w.length - 1; i++) if (vm[w[i]]) res[w.slice(0, i) + vm[w[i]] + w.slice(i + 1)] = 1;
    for (i = 1; i < w.length - 1; i++) res[w.slice(0, i) + w.slice(i + 1)] = 1;
    if (w.indexOf('ie') >= 0) res[w.replace('ie', 'ei')] = 1;
    if (w.indexOf('ei') >= 0) res[w.replace('ei', 'ie')] = 1;
    delete res[w];
    return Object.keys(res);
  }
  function spellParts(c) {
    if (c.k !== 'w' || /[\/…(]/.test(c.f)) return null;
    var parts = c.f.split(' '); if (parts.length > 3) return null;
    var idx = -1, best = 0;
    parts.forEach(function (p, k) { if (/^[a-z]+$/i.test(p) && p.toLowerCase() !== 'to' && p.length >= 5 && p.length > best) { best = p.length; idx = k; } });
    return idx < 0 ? null : { parts: parts, idx: idx };
  }
  function spellQ(c) {
    var sp = spellParts(c); if (!sp) return null;
    var vs = shuffle(mutate(sp.parts[sp.idx])).filter(function (v) {
      var full = sp.parts.map(function (p, k) { return k === sp.idx ? v : p; }).join(' ');
      return !ALLF[norm(full)];
    }).slice(0, 3);
    if (vs.length < 3) return null;
    var opts = vs.map(function (v) { return { t: sp.parts.map(function (p, k) { return k === sp.idx ? v : p; }).join(' '), ok: false }; });
    opts.push({ t: c.f, ok: true });
    return { kind: 'mcq', tag: 'Orthographe', prompt: c.b, hint: 'Quelle est la bonne orthographe en anglais ?', opts: shuffle(opts), explain: 'Bonne orthographe : ' + c.f, card: c };
  }
  var REG = { grow: 'growed', forget: 'forgetted', draw: 'drawed', think: 'thinked', blow: 'blowed', lie: 'lied' };
  function irrQ(c) {
    var base = c.f.replace(/^to /, '').replace(/\s*\(.*\)/, '');
    var p = c.irr[0], pp = c.irr[1], r = REG[base] || (base + 'ed');
    var good = p + ' – ' + pp;
    var cand = [p + ' – ' + p, pp + ' – ' + pp, pp + ' – ' + p, r + ' – ' + r, p + ' – ' + r, r + ' – ' + pp];
    var seen = {}; seen[good] = 1;
    var wrong = shuffle(cand).filter(function (x) { if (seen[x]) return false; seen[x] = 1; return true; }).slice(0, 3);
    var opts = wrong.map(function (x) { return { t: x, ok: false }; });
    opts.push({ t: good, ok: true });
    return { kind: 'mcq', tag: 'Verbe irrégulier', prompt: 'to ' + base, hint: c.b + '. Quel est le prétérit et le participe passé ?', opts: shuffle(opts), explain: 'to ' + base + ' – ' + p + ' – ' + pp, card: c };
  }
  function wchoice(list) {
    var tot = list.reduce(function (s, x) { return s + x[1]; }, 0), r = Math.random() * tot;
    for (var i = 0; i < list.length; i++) { r -= list[i][1]; if (r <= 0) return list[i][0]; }
    return list[0][0];
  }
  function makeQ(c, T) {
    if (c.k === 'a') {
      var r = Math.random();
      if (r < 0.5) return mcq(c, 'abbr2full');
      if (r < 0.8) return mcq(c, 'full2abbr');
      return T.typed ? typedFull(c) : mcq(c, 'abbr2full');
    }
    if (T.irr && c.irr && Math.random() < 0.65) return irrQ(c);
    var pool = [];
    if (T.en2fr) pool.push(['en2fr', 38]);
    if (T.fr2en) pool.push(['fr2en', 30]);
    if (T.typed && c.typed) pool.push(['typed', 17]);
    if (T.spell && spellParts(c)) pool.push(['spell', 9]);
    if (!pool.length) pool.push(['en2fr', 1]);
    var t = wchoice(pool);
    if (t === 'typed') return typedWord(c);
    if (t === 'spell') return spellQ(c) || mcq(c, 'en2fr');
    return mcq(c, t);
  }
  function build(n, conf) {
    var T = conf.T;
    var words = CARDS.filter(function (c) { return c.k !== 'a'; });
    var acr = T.abbr ? CARDS.filter(function (c) { return c.k === 'a'; }) : [];
    if (conf.focus === 'weak') {
      var w2 = words.filter(isWeak), a2 = acr.filter(isWeak);
      if (w2.length + a2.length >= 8) { words = w2; acr = a2; } else { words = words.filter(function (c) { return true; }); }
    }
    var nA = acr.length ? Math.min(acr.length, Math.max(3, Math.round(n * 0.17))) : 0;
    if (conf.focus === 'weak') nA = Math.min(nA, acr.length);
    var cards = pickCards(acr, nA).concat(pickCards(words, n - nA));
    return shuffle(cards).map(function (c) { return makeQ(c, T); });
  }

  /* ---------- état et rendu ---------- */
  var S = null, timer = null;
  function view(name) {
    ['quiz', 'end', 'set', 'corr'].forEach(function (v) { $('#v-' + v).hidden = v !== name; });
    window.scrollTo(0, 0);
  }
  function newSeries(qs) {
    S = { qs: qs, i: 0, score: 0, done: 0, wrong: [], streak: 0, best: 0, t0: Date.now(), locked: false };
    showQ();
  }
  function startDefault() { newSeries(build(cfg.n, cfg)); }
  function record(q, ok, given) {
    var k = q.card.f, st = stats[k] || { m: 0, s: 0 };
    if (ok) { st.s += 1; } else { st.m += 1; st.s = 0; }
    stats[k] = st; LS.set('vocab_stats_v1', stats);
    S.done++;
    if (ok) { S.score++; S.streak++; if (S.streak > S.best) S.best = S.streak; }
    else { S.streak = 0; S.wrong.push({ q: q, given: given }); }
    $('#score').textContent = S.score;
    $('#streak').textContent = S.streak >= 3 ? 'Série : ' + S.streak : '';
  }
  function showQ() {
    view('quiz');
    var q = S.qs[S.i]; if (!q) return end();
    S.locked = false;
    $('#cnt').textContent = (S.i + 1) + ' / ' + S.qs.length;
    $('#score').textContent = S.score;
    $('#streak').textContent = S.streak >= 3 ? 'Série : ' + S.streak : '';
    $('#fill').style.width = (S.i / S.qs.length * 100) + '%';
    var h = '<span class="tag">' + esc(q.tag) + '</span><h1 class="prompt">' + esc(q.prompt) + '</h1>';
    if (q.hint) h += '<p class="hint">' + esc(q.hint) + '</p>';
    if (q.kind === 'mcq') {
      h += '<div class="opts">' + q.opts.map(function (o, i) {
        return '<button class="opt" data-i="' + i + '"><span class="n">' + (i + 1) + '</span><span>' + esc(o.t) + '</span></button>';
      }).join('') + '</div>';
    } else {
      h += '<div class="typed"><input id="ans" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Ta réponse"><button class="primary" id="ok">Valider</button></div>' +
        '<div class="row"><button class="link" id="idk">Je ne sais pas</button></div>';
    }
    h += '<div id="fb"></div>';
    $('#card').innerHTML = h;
    if (q.kind === 'mcq') {
      Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (b) { b.addEventListener('click', function () { answerMcq(+b.getAttribute('data-i')); }); });
    } else {
      $('#ok').addEventListener('click', function () { answerTyped(false); });
      $('#idk').addEventListener('click', function () { answerTyped(true); });
      var inp = $('#ans'); if (inp) { try { inp.focus(); } catch (e) {} }
    }
  }
  function feedback(ok, head, body, cls) {
    var last = S.i === S.qs.length - 1;
    $('#fb').innerHTML = '<div class="fb ' + (cls || (ok ? 'good' : 'bad')) + '"><strong>' + esc(head) + '</strong><span>' + esc(body) + '</span></div>' +
      '<div class="row" style="margin-top:12px"><button class="primary" id="next">' + (last ? 'Voir le bilan' : 'Suivant') + '</button></div>';
    var nb = $('#next'); nb.addEventListener('click', next);
    if (ok && cfg.auto && !last) { timer = setTimeout(next, 850); } else { try { nb.focus(); } catch (e) {} }
  }
  function next() { if (timer) { clearTimeout(timer); timer = null; } S.i++; if (S.i >= S.qs.length) end(); else showQ(); }
  function answerMcq(idx) {
    if (S.locked) return; S.locked = true;
    var q = S.qs[S.i], ok = q.opts[idx].ok;
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (b, i) {
      b.disabled = true;
      if (q.opts[i].ok) b.classList.add('ok'); else if (i === idx) b.classList.add('bad'); else b.classList.add('dim');
    });
    record(q, ok, q.opts[idx].t);
    feedback(ok, ok ? 'Juste' : 'Raté', q.explain);
  }
  function answerTyped(giveUp) {
    if (S.locked) return;
    var q = S.qs[S.i], inp = $('#ans'), val = inp.value;
    if (!giveUp && !norm(val)) { inp.focus(); return; }
    S.locked = true; inp.disabled = true; $('#ok').disabled = true; $('#idk').disabled = true;
    var u = norm(val), ok = false, near = false, note = '';
    if (!giveUp) {
      if (q.accepted.indexOf(u) >= 0) ok = true;
      else {
        var best = Math.min.apply(null, q.accepted.map(function (a) { return lev(u, a); }));
        if (q.tol > 0 && best <= q.tol) { ok = true; note = ' (petite faute tolérée)'; }
        else if (best <= 1 && u.length >= 4) near = true;
      }
    }
    record(q, ok, giveUp ? '(passé)' : val);
    if (ok) feedback(true, 'Juste', q.explain + note);
    else if (near) feedback(false, 'Presque : une lettre à corriger', 'Réponse : ' + q.show + '. ' + q.explain, 'warn');
    else feedback(false, giveUp ? 'Voilà la réponse' : 'Raté', 'Réponse : ' + q.show + '. ' + q.explain);
  }
  function end() {
    if (timer) { clearTimeout(timer); timer = null; }
    S.ended = true;
    view('end');
    var N = S.done, pct = N ? Math.round(S.score / N * 100) : 0;
    var secs = Math.round((Date.now() - S.t0) / 1000), mm = Math.floor(secs / 60), ss = ('0' + (secs % 60)).slice(-2);
    var msg = !N ? 'Aucune question répondue.' : pct >= 90 ? 'Très solide.' : pct >= 75 ? 'Bien. Quelques trous à boucher.' : pct >= 55 ? 'Il reste du travail, refais tes erreurs.' : 'Pas encore ça. Refais tes erreurs puis relance une série.';
    var seen = {}, uniq = S.wrong.filter(function (w) { if (seen[w.q.card.i]) return false; seen[w.q.card.i] = 1; return true; });
    var h = '<h2>Bilan</h2><div class="big">' + S.score + ' / ' + N + '</div><p style="margin:0">' + pct + ' % de réussite. ' + msg + '</p>' +
      '<div class="stats"><span>Temps : <b>' + mm + ' min ' + ss + ' s</b></span><span>Meilleure série : <b>' + S.best + '</b></span><span>Mots ratés : <b>' + uniq.length + '</b></span></div>' +
      '<div class="row"><button class="primary" id="e-new">Nouvelle série aléatoire</button>' +
      (uniq.length ? '<button class="ghost" id="e-redo">Refaire mes erreurs (' + uniq.length + ')</button>' : '') +
      '<button class="ghost" id="e-set">Réglages</button></div>';
    if (uniq.length) {
      h += '<h3>Mes erreurs</h3><div class="list">' + uniq.map(function (w) {
        var c = w.q.card;
        return '<div><span class="q">' + esc(c.f) + '  =  ' + esc(c.b) + '</span><span class="a">Ta réponse : <s>' + esc(w.given) + '</s></span></div>';
      }).join('') + '</div>';
    }
    $('#v-end').innerHTML = h;
    $('#e-new').addEventListener('click', startDefault);
    $('#e-set').addEventListener('click', openSettings);
    var rb = $('#e-redo');
    if (rb) rb.addEventListener('click', function () {
      var all = { en2fr: true, fr2en: true, typed: true, spell: true, abbr: true, irr: true };
      newSeries(shuffle(uniq.map(function (w) { return makeQ(w.q.card, all); })));
    });
  }

  /* ---------- réglages et corrections ---------- */
  var KEYS = ['en2fr', 'fr2en', 'typed', 'spell', 'abbr', 'irr'];
  function openSettings() {
    KEYS.forEach(function (k) { $('#t-' + k).checked = !!cfg.T[k]; });
    $('#s-n').value = String(cfg.n); $('#s-focus').value = cfg.focus; $('#s-auto').checked = !!cfg.auto;
    var weak = CARDS.filter(isWeak).length;
    $('#fine').textContent = CARDS.length + ' cartes chargées (dont ' + CARDS.filter(function (c) { return c.k === 'a'; }).length + ' abréviations). Mots ratés repérés sur cet appareil : ' + weak + '.';
    view('set');
  }
  function applySettings() {
    KEYS.forEach(function (k) { cfg.T[k] = $('#t-' + k).checked; });
    if (!cfg.T.en2fr && !cfg.T.fr2en && !cfg.T.typed) cfg.T.en2fr = true;
    cfg.n = +$('#s-n').value; cfg.focus = $('#s-focus').value; cfg.auto = $('#s-auto').checked;
    LS.set('vocab_cfg_v1', cfg);
  }
  function openCorr() {
    $('#corr-list').innerHTML = CORR.map(function (c) {
      var left = esc(c.of) + '  /  ' + esc(c.ob);
      if (c.excluded) return '<div><span class="q">' + left + '</span><span class="a">Retirée du quiz.</span><span class="note">' + esc(c.note || '') + '</span></div>';
      return '<div><span class="q"><s style="color:var(--bad)">' + left + '</s></span><span class="a">' + esc(c.nf) + '  /  ' + esc(c.nb) + '</span>' + (c.note ? '<span class="note">' + esc(c.note) + '</span>' : '') + '</div>';
    }).join('');
    view('corr');
  }
  $('#b-set').addEventListener('click', openSettings);
  $('#b-stop').addEventListener('click', end);
  $('#b-cancel').addEventListener('click', function () { if (S && !S.ended) view('quiz'); else end(); });
  $('#b-go').addEventListener('click', function () { applySettings(); startDefault(); });
  $('#b-corr').addEventListener('click', openCorr);
  $('#b-corr-back').addEventListener('click', openSettings);
  $('#b-reset').addEventListener('click', function () { stats = {}; LS.set('vocab_stats_v1', stats); openSettings(); });

  document.addEventListener('keydown', function (e) {
    if ($('#v-quiz').hidden || !S) return;
    var q = S.qs[S.i]; if (!q) return;
    if (e.key === 'Enter') {
      if (S.locked) { var nb = $('#next'); if (nb) { e.preventDefault(); next(); } }
      else if (q.kind === 'typed') { e.preventDefault(); answerTyped(false); }
    } else if (q.kind === 'mcq' && !S.locked && /^[1-4]$/.test(e.key)) { answerMcq(+e.key - 1); }
  });

  window.__vocab = { build: build, makeQ: makeQ, CARDS: CARDS };
  startDefault();
})();
</script>
